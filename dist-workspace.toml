[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# release.yml contains project-owned validation, wheel, and trusted-publishing jobs.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Build the distributed binary separately from the Python extension package,
# and omit embedded Python from prebuilt archives so they remain portable.
precise-builds = true
default-features = false
features = ["cli", "mcp"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# Path that installers should place binaries in
install-path = "~/.local/bin/"
# Whether to install an updater program
install-updater = false
