[workspace]
members = ["ntoseye-py"]

[workspace.package]
version = "0.22.0"

[package]
name = "ntoseye"
version.workspace = true
edition = "2024"
authors = [ "dmaivel" ]
description = "Windows kernel debugger for Linux hosts running Windows under KVM/QEMU and VMware"
license = "MIT"
repository = "https://github.com/dmaivel/ntoseye"
readme = "README.md"
keywords = [ "virtualization", "introspection", "memory", "windbg", "kvm" ]
categories = [ "security", "os" ]

[[bin]]
name = "ntoseye"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
iced-x86 = "1.21.0"
indicatif = "0.18.3"
memmap2 = "0.9.9"
nix = { version = "0.31.3", features = [ "process", "uio" ] }
owo-colors = "4.2.3"
pelite = "0.10.0"
reqwest = { version = "0.13.4", default-features = false, features = [ "blocking", "rustls", "charset", "http2" ] }
tabled = { version = "0.21.0", features = [ "ansi" ] }
zerocopy = { version = "0.8.31", features = [ "derive" ] }
rayon = "1.11.0"
thiserror = "2.0.18"
hex = "0.4.3"
derive_more = { version = "2.1.1", features = ["full"] }
pdb2 = "0.10.1"
spin = "0.12.1"
dashmap = "6.1.0"
nucleo-matcher = "0.3.1"
single-instance = "0.3.3"
winnow = "1.0"
linkme = "0.3"
textwrap = "0.16"
terminal_size = "0.4"

pyo3 = { version = "0.29.0", features = ["abi3-py39"], optional = true }

ctrlc = { version = "3.4", optional = true }
argh = { version = "0.1.13", optional = true }
dialoguer = { version = "0.12.0", default-features = false, optional = true }
nu-ansi-term = { version = "0.50.3", optional = true }
reedline = { version = "0.49.0", optional = true }

rmcp = { version = "2.2", features = ["server", "transport-io", "transport-streamable-http-server", "macros"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-std", "net", "signal", "time"], optional = true }
tokio-util = { version = "0.7", default-features = false, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
tower-http = { version = "0.7", default-features = false, features = ["cors"], optional = true }
anyhow = { version = "1", optional = true }
kdmp-parser = "0.8"

[features]
default = ["cli", "mcp", "python-embed"]
cli = ["dep:ctrlc", "dep:argh", "dep:dialoguer", "dep:nu-ansi-term", "dep:reedline"]
mcp = ["dep:rmcp", "dep:schemars", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tokio-util", "dep:axum", "dep:tower-http", "dep:anyhow"]
python = ["dep:pyo3"]
python-embed = ["python", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]

[profile.dev.package.pdb2]
debug-assertions = false

[profile.test.package.pdb2]
debug-assertions = false

[profile.dist]
inherits = "release"
lto = "thin"
