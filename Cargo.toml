[workspace]
members = ["python"]

[workspace.package]
version = "0.36.0"

[package]
name = "ntoseye"
version.workspace = true
edition = "2024"
authors = [ "dmaivel" ]
description = "WinDbg-like kernel debugger for Windows, from Linux and macOS"
license = "MIT"
repository = "https://github.com/dmaivel/ntoseye"
readme = "README.md"
keywords = [ "virtualization", "introspection", "memory", "windbg", "kvm" ]
categories = [ "security", "os" ]
exclude = [ "media/*" ]

[[bin]]
name = "ntoseye"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
iced-x86 = "1.21.0"
bad64 = "0.12"
indicatif = "0.18.3"
memmap2 = "0.9.9"
owo-colors = "4.2.3"
pelite = "0.10.0"
reqwest = { version = "0.13.4", default-features = false, features = [ "blocking", "rustls", "charset", "http2" ] }
tabled = { version = "0.21.0", default-features = false, features = [ "std", "ansi" ] }
zerocopy = { version = "0.8.31", features = [ "derive" ] }
rayon = "1.11.0"
thiserror = "2.0.18"
hex = "0.4.3"
derive_more = { version = "2.1.1", features = ["full"] }
pdb2 = "0.10.1"
spin = "0.12.1"
dashmap = "6.1.0"
nucleo-matcher = "0.3.1"
single-instance = "0.3.3"
winnow = "1.0"
linkme = "0.3"
textwrap = "0.16"
terminal_size = "0.4"
aes = "0.8"
cbc = "0.1"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"

pyo3 = { version = "0.29.0", features = ["abi3-py39"], optional = true }

ctrlc = { version = "3.4", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
dialoguer = { version = "0.12.0", default-features = false, optional = true }
nu-ansi-term = { version = "0.50.3", optional = true }
reedline = { version = "0.49.0", optional = true }

base64 = { version = "0.22", optional = true }
rmcp = { version = "2.2", features = ["server", "transport-io", "transport-streamable-http-server", "macros"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-std", "net", "signal", "time"], optional = true }
tokio-util = { version = "0.7", default-features = false, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
tower-http = { version = "0.7", default-features = false, features = ["cors"], optional = true }
anyhow = { version = "1", optional = true }
gdbstub = { version = "0.7.10", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = [ "process", "uio" ] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["cli", "mcp", "dap", "gdbserver", "python-embed"]
# The command engine (parser, dispatcher, renderers) every host drives; the
# interactive prompt itself needs `cli`. Off, the crate is the debugger core.
repl = []
cli = ["repl", "dep:ctrlc", "dep:clap", "dep:dialoguer", "dep:nu-ansi-term", "dep:reedline"]
mcp = ["repl", "dep:rmcp", "dep:schemars", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tokio-util", "dep:axum", "dep:tower-http", "dep:anyhow"]
dap = ["repl", "dep:serde_json", "dep:base64"]
gdbserver = ["repl", "dep:gdbstub"]
python = ["repl", "dep:pyo3"]
python-embed = ["python", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]

[dev-dependencies]
parking_lot = "0.12"

[profile.dev.package.pdb2]
debug-assertions = false

[lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"

[profile.test.package.pdb2]
debug-assertions = false

[profile.dist]
inherits = "release"
lto = "thin"
