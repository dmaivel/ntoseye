name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The feature set the release archives are built with (dist-workspace.toml):
  # no embedded Python, so the runner needs no Python toolchain.
  FEATURES: --no-default-features --features cli,mcp,dap

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked -p ntoseye $FEATURES --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p ntoseye $FEATURES
