# Deploy the documentation site at ntoseye.com from the chosen branch or tag,
# without a release. The steps match `deploy-docs` in release.yml, which
# deploys the site for every release; the command reference comes from the
# deployed commit's registry.
name: Deploy docs

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a second request waits for the first to finish.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dump the command reference
        run: cargo run --locked --no-default-features --features cli,mcp,dap,gdbserver --bin ntoseye -- --dump-command-reference > "$RUNNER_TEMP/commands.json"
      - name: Build the site
        env:
          NTOSEYE_COMMAND_REFERENCE: ${{ runner.temp }}/commands.json
        run: |
          python -m pip install --quiet -r docs/requirements.txt
          sphinx-build -b dirhtml -n -W --keep-going docs docs/_build/html
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
