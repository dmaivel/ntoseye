[package]
name = "ntoseye-macros"
version.workspace = true
edition = "2024"
authors = [ "dmaivel" ]
description = "Procedural macros for the ntoseye kernel debugger"
license = "MIT"
homepage = "https://ntoseye.com"
repository = "https://github.com/dmaivel/ntoseye"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
