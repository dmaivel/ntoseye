[package]
name = "ntoseye-py"
version.workspace = true
edition = "2024"
authors = [ "dmaivel" ]
description = "Python SDK and CLI for the ntoseye Windows kernel debugger"
license = "MIT"
publish = false

[lib]
name = "_ntoseye"
crate-type = ["cdylib"]

[dependencies]
ntoseye_core = { package = "ntoseye", path = "..", default-features = false, features = ["python-extension", "python-stubs", "cli", "mcp", "dap", "gdbserver"] }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39"] }
# Loaded with dlopen, so it uses the TLS model that works from a library
# Python loads after startup.
mimalloc = { version = "0.1.52", features = ["v2", "local_dynamic_tls"] }
